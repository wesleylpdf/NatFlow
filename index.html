<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-100 dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020617">
    <title>NatFlow - Controle Financeiro</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NatFlow">

    <!-- Guarda de versão: se este index.html veio do cache do navegador ou CDN
         e já existe uma build mais nova no servidor, recarrega a versão atualizada imediatamente -->
    <script>
      (function () {
        var versaoAtual = '__BUILD_VERSION__'
        var base = '__BUILD_BASE__'
        if (versaoAtual.indexOf('__') === 0) return // modo dev

        var url = new URL(window.location.href)
        if (url.searchParams.get('v') === versaoAtual) return

        fetch(base + 'version.json?_=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null })
          .then(function (dados) {
            if (!dados || !dados.version || dados.version === versaoAtual) return
            try {
              localStorage.setItem('natflow_ultima_versao', versaoAtual)
              localStorage.setItem('natflow_atualizado_flag', dados.version)
            } catch (e) {}
            url.searchParams.set('v', dados.version)
            url.searchParams.set('_t', String(Date.now()))
            window.location.replace(url.toString())
          })
          .catch(function () {})
      })()
    </script>

    <!-- Aplica o tema salvo antes do primeiro paint para evitar flash de tela branca e sincroniza a barra do sistema com a cor de fundo -->
    <script>
      (function () {
        try {
          var tema = localStorage.getItem('natflow_tema')
          var metaTheme = document.querySelector('meta[name="theme-color"]')
          if (tema === 'light') {
            document.documentElement.classList.remove('dark')
            if (metaTheme) metaTheme.setAttribute('content', '#f1f5f9')
          } else {
            document.documentElement.classList.add('dark')
            if (metaTheme) metaTheme.setAttribute('content', '#020617')
          }
        } catch (e) {}
      })()
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-slate-50 to-emerald-50/40 px-3 py-4 sm:px-6 sm:py-6 transition-colors duration-300 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 text-slate-800 dark:text-slate-100">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
      }
    </script>
</body>
</html>
